services:
  postgres:
    image: postgres:16-alpine
    container_name: recovery_agent_db
    environment:
      POSTGRES_DB: recovery_agent
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery_dev_pass
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
